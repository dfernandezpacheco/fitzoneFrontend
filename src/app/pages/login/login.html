<div class="login-container py-25">

  <header class="fixed top-0 left-0 right-0 z-50 bg-[#0B0F17]/80 backdrop-blur-md border-b border-[#1E293B]">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <!-- Logo -->
      <a href="#" class="flex items-center gap-2">
        <div class="w-10 h-10 bg-[#2563EB] rounded-lg flex items-center justify-center font-bold text-white text-xl">
          FZ
        </div>
        <span class="font-bold text-xl text-white tracking-wide">FitZone</span>
      </a>

      <!-- Navegación Central -->
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
        <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="font-bold text-white" class="text-[#94A3B8] hover:text-white transition-colors">Inicio</a>
        <a routerLink="/clases" routerLinkActive="font-bold text-white" class="text-[#94A3B8] hover:text-white transition-colors">Clases</a>
        <a routerLink="/membresia" routerLinkActive="font-bold text-white" class="text-[#94A3B8] hover:text-white transition-colors">Membresia</a>
      </nav>

      <!-- Botones Derecha -->
      <div class="flex items-center gap-4">
        <a href="../login" class="text-sm font-medium text-white hover:text-[#94A3B8] transition-colors">Ingresar</a>
        <a href="#" class="bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-all">
          Comenzar
        </a>
      </div>
    </div>

  </header>

  <div class="login-card">

    <!-- Columna izquierda: imagen -->
    <div class="login-image-side">

      <img
        src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop"
        alt="Instalaciones del gimnasio FitZone"
      />

      <div class="image-overlay">

        <h3>Transforma tu cuerpo</h3>

        <p>Accede a tus rutinas y sigue tu progreso diario.</p>

      </div>

    </div>


    <!-- Columna derecha: formulario -->
    <div class="login-form-side">

      <div class="form-header">

        <h2>Bienvenido de nuevo</h2>

        <p>Introduce tus credenciales para acceder a FitZone.</p>

      </div>


      <!-- Formulario de login -->
      <form
        class="login-form"
        (ngSubmit)="onLogin()"
        #loginForm="ngForm"
      >

        <!-- Nombre de usuario -->
        <div class="form-group">

          <label for="usuario">Nombre de usuario</label>

          <input
            type="text"
            id="usuario"
            name="usuario"
            [(ngModel)]="usuario"
            placeholder="Introduce tu nombre de usuario"
            autocomplete="username"
            required
          />

        </div>


        <!-- Contraseña -->
        <div class="form-group">

          <div class="label-wrapper">

            <label for="clave">Contraseña</label>

          </div>

          <input
            type="password"
            id="clave"
            name="clave"
            [(ngModel)]="clave"
            placeholder="Introduce tu contraseña"
            autocomplete="current-password"
            required
          />

        </div>


        <!-- Mensaje de error -->
        @if (mensajeError) {

          <p class="login-error" role="alert">
            {{ mensajeError }}
          </p>

        }


        <!-- Botón de iniciar sesión -->
        <button
          type="submit"
          class="btn-submit"
          [disabled]="cargando || loginForm.invalid"
        >

          {{ cargando ? 'Iniciando sesión...' : 'Ingresar' }}

        </button>

      </form>


      <!-- Pie del formulario -->
      <div class="form-footer">

        <p>
          ¿Aún no tienes cuenta?
          <a routerLink="/registro">Únete a FitZone</a>
        </p>

      </div>

    </div>

  </div>

</div>
