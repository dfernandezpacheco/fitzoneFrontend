<div class="login-container py-10">
  <div class="login-card">
    <div class="login-image-side">
      <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop" alt="Instalaciones del gimnasio FitZone" />
      <div class="image-overlay">
        <h3>Tu próxima meta empieza aquí.</h3>
        <p>Únete a FitZone y reserva tus clases y gestiona tu membresía.</p>
      </div>
    </div>
    <div class="login-form-side">
      <div class="form-header">
        <h2>Crea tu cuenta</h2>
        <p>Regístrate para empezar a entrenar en FitZone.</p>
      </div>
      <form class="login-form" (ngSubmit)="registrar()" #registroForm="ngForm">
        <div class="form-group">
          <label for="nombreCompleto">Nombre completo</label>
          <input id="nombreCompleto" name="nombreCompleto" [(ngModel)]="nombreCompleto" placeholder="Tu nombre y apellidos" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="dni">DNI</label>
          <input id="dni" name="dni" [(ngModel)]="dni" placeholder="12345678Z" maxlength="9" required />
        </div>
        <div class="form-group">
          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" [(ngModel)]="correo" placeholder="tu@email.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="tel" [(ngModel)]="telefono" placeholder="Tu número de teléfono" autocomplete="tel" required />
        </div>
        <div class="form-group">
          <label for="matricula">Matrícula <span>(opcional)</span></label>
          <input id="matricula" name="matricula" [(ngModel)]="matricula" placeholder="1234DBV" maxlength="7" />
          <small>4 números y 3 consonantes. Ejemplo: 1234DBV.</small>
        </div>
        <div class="form-group">
          <label for="planId">Plan mensual</label>
          <select id="planId" name="planId" [(ngModel)]="planId" required [disabled]="cargandoPlanes">
            <option [ngValue]="null" disabled>Selecciona tu plan</option>
            <option *ngFor="let plan of planes" [ngValue]="plan.id">{{ plan.nombre }} · {{ plan.precioMensual | currency:'EUR':'symbol':'1.2-2' }}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" name="contrasena" type="password" [(ngModel)]="contrasena" placeholder="Crea una contraseña" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="form-group">
          <label for="confirmarContrasena">Confirma la contraseña</label>
          <input id="confirmarContrasena" name="confirmarContrasena" type="password" [(ngModel)]="confirmarContrasena" placeholder="Repite tu contraseña" autocomplete="new-password" required />
        </div>
        <p *ngIf="error" class="login-error" role="alert">{{ error }}</p>
        <button type="submit" class="btn-submit" [disabled]="cargando || cargandoPlanes || registroForm.invalid">
          {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>
      </form>
      <div class="form-footer">
        <p>¿Ya tienes una cuenta? <a routerLink="/login">Iniciar sesión</a></p>
      </div>
    </div>
  </div>
</div>
